name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - name: Install the suite
        working-directory: e2e
        run: npm ci
      - name: Typecheck the suite
        working-directory: e2e
        run: npx tsrs --noEmit -p .
      - name: Run the suite
        working-directory: e2e
        run: npx e2e run
  mods:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - name: Validate and test codemode
        working-directory: codemode
        run: npx --yes @anthropic-ai/claude-code@2.1.325 plugin validate . && npx --yes @anthropic-ai/claude-code@2.1.325 plugin test
      - name: Validate and test codemode-agents
        working-directory: codemode-agents
        run: npx --yes @anthropic-ai/claude-code@2.1.325 plugin validate . && npx --yes @anthropic-ai/claude-code@2.1.325 plugin test